<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Пробный прогон | АОС ПИ</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/javascript.js"></script>
</head>
<body>
<div id="wrapper">
    <div th:insert="~{blocks/header :: sidebar}"></div>
    <div id="content-wrapper">
        <div th:insert="~{blocks/header :: topbar}"></div>
        <div th:insert="~{blocks/header :: overlay}"></div>
        <main class="container-fluid">

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="profile-card p-4">

                        <div class="alert alert-warning d-flex align-items-center mb-3">
                            <i class="bi bi-flask me-2 fs-5"></i>
                            <div>
                                <strong>Пробный прогон.</strong>
                                Диагностический режим: ответы и результат <strong>не сохраняются</strong>
                                и в журналах не появятся.
                            </div>
                        </div>

                        <h1 class="page-title" th:text="${testDTO.title}"></h1>
                        <p class="text-muted" th:if="${testDTO.description}" th:text="${testDTO.description}"></p>

                        <div class="row g-3 mb-4 mt-2">
                            <div class="col-auto">
                                <div class="profile-card p-3 text-center">
                                    <div class="text-muted small">Вопросов в попытке</div>
                                    <div class="fs-4 fw-bold" th:text="${testDTO.questionsPerAttempt}"></div>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="profile-card p-3 text-center">
                                    <div class="text-muted small">Всего в пуле</div>
                                    <div class="fs-4 fw-bold" th:text="${testDTO.questionCount}"></div>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="profile-card p-3 text-center">
                                    <div class="text-muted small">Время</div>
                                    <div class="fs-4 fw-bold">
                                        <span th:if="${testDTO.timeLimit > 0}" th:text="${testDTO.timeLimit + ' мин'}"></span>
                                        <span th:if="${testDTO.timeLimit == 0}">∞</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="profile-card p-3 text-center">
                                    <div class="text-muted small">Проходной балл</div>
                                    <div class="fs-4 fw-bold" th:text="${testDTO.passingScore + '%'}"></div>
                                </div>
                            </div>
                        </div>

                        <div th:if="${testDTO.questionCount == 0 || testDTO.questionsPerAttempt > testDTO.questionCount}"
                             class="alert alert-secondary">
                            <i class="bi bi-exclamation-triangle"></i>
                            Недостаточно вопросов в пуле для запуска пробного прогона.
                        </div>

                        <form th:if="${testDTO.questionCount > 0 && testDTO.questionsPerAttempt <= testDTO.questionCount}"
                              th:action="@{/employee/chief/tests/preview/{id}/start(id=${testDTO.id})}"
                              method="post">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-play-fill"></i> Начать пробный прогон
                            </button>
                        </form>

                        <div class="link-section mt-3">
                            <a th:href="@{/employee/chief/tests/detailsTest/{id}(id=${testDTO.id})}">← К деталям теста</a>
                        </div>

                    </div>
                </div>
            </div>

        </main>
        <div th:insert="~{blocks/footer :: footer}"></div>
    </div>
</div>
</body>
</html>
